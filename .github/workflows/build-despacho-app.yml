name: Build & Release Despacho App

# despacho-app-v* 태그 push 시 Android APK + Windows(zip) 빌드 → ventago-downloads 릴리스 업로드.
on:
  push:
    tags:
      - 'despacho-app-v*'

permissions:
  contents: write

jobs:
  # ── Android APK ────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # pubspec version 을 태그 버전과 동기화 (build number = run number)
      - name: Sync pubspec version with tag
        shell: bash
        working-directory: despacho-app
        run: |
          VERSION="${GITHUB_REF_NAME#despacho-app-v}"
          sed -i "s/^version: .*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          echo "pubspec version -> ${VERSION}+${GITHUB_RUN_NUMBER}"

      - name: flutter pub get
        working-directory: despacho-app
        run: flutter pub get

      - name: Build APK (release)
        working-directory: despacho-app
        run: flutter build apk --release

      - name: Rename APK
        working-directory: despacho-app
        run: cp build/app/outputs/flutter-apk/app-release.apk build/VentaGO-Despacho.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: despacho-app/build/VentaGO-Despacho.apk
          tag_name: ${{ github.ref_name }}
          # 릴리스는 전용 public repo 로 업로드 (코드 repo 는 private 유지)
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

  # ── Windows (zip) ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows (zip)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        working-directory: despacho-app
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: despacho-app
        run: flutter build windows --release

      # Flutter Windows 산출물은 폴더(exe+dll) → 단일 배포 파일로 zip.
      - name: Zip Windows build
        shell: pwsh
        working-directory: despacho-app
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-Not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          Compress-Archive -Path "$src/*" -DestinationPath "build/VentaGO-Despacho-Windows.zip" -Force

      - name: Upload Windows zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: despacho-app/build/VentaGO-Despacho-Windows.zip
          tag_name: ${{ github.ref_name }}
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true
