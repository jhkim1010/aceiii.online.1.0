name: Build Colibri (Ventago móvil)

# Tags colibri-v* o ejecución manual: APK Android + compilación iOS sin firma.
# La publicación a ventago-downloads la agrega el Plan 20 (depende de la firma).
on:
  push:
    tags:
      - 'colibri-v*'
  workflow_dispatch:

env:
  PROD_BASE_URL: https://newapi.coolsistema.com/api

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch colibri submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1 colibri
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: flutter pub get
        working-directory: colibri
        run: flutter pub get
      - name: flutter test
        working-directory: colibri
        run: flutter test
      - name: Build APK (release, prod)
        working-directory: colibri
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: colibri-apk
          path: colibri/build/app/outputs/flutter-apk/app-release.apk

  build-ios-check:
    name: iOS (compile check, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch colibri submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1 colibri
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: flutter pub get
        working-directory: colibri
        run: flutter pub get
      - name: Build iOS (release, no codesign)
        working-directory: colibri
        run: flutter build ios --release --no-codesign --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
