name: Build & Release Tienda Admin App

# tienda-admin-app-v* 태그 push 시 Android APK 빌드 → ventago-downloads 릴리스 업로드.
# 매장 관리자 전용 앱 — 릴리스 바이너리는 운영 API(newapi.coolsistema.com) 를 가리킨다.
on:
  push:
    tags:
      - 'tienda-admin-app-v*'

permissions:
  contents: write

env:
  PROD_BASE_URL: https://newapi.coolsistema.com/api

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sync pubspec version with tag
        shell: bash
        working-directory: tienda-admin-app
        run: |
          VERSION="${GITHUB_REF_NAME#tienda-admin-app-v}"
          sed -i "s/^version: .*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          echo "pubspec version -> ${VERSION}+${GITHUB_RUN_NUMBER}"

      - name: flutter pub get
        working-directory: tienda-admin-app
        run: flutter pub get

      - name: Build APK (release)
        working-directory: tienda-admin-app
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}

      - name: Rename APK
        working-directory: tienda-admin-app
        run: cp build/app/outputs/flutter-apk/app-release.apk build/VentaGO-Tienda-Admin.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VentaGO-Tienda-Admin-Android
          path: tienda-admin-app/build/VentaGO-Tienda-Admin.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: tienda-admin-app/build/VentaGO-Tienda-Admin.apk
          tag_name: ${{ github.ref_name }}
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true
