name: Build & Release Mobile Sales App

# mobile-sales-app-v* 태그 push 시 Android APK + Windows(zip) + macOS(zip) 빌드
# → ventago-downloads 릴리스 업로드.
# 판매원(vendedor) 앱 — 릴리스 바이너리는 운영 API(newapi.coolsistema.com) 를 가리킨다.
# (로컬 개발은 api_config 기본값 localhost:5002 유지 — 배포본만 prod)
on:
  push:
    tags:
      - 'mobile-sales-app-v*'

permissions:
  contents: write

env:
  PROD_BASE_URL: https://newapi.coolsistema.com/api

jobs:
  # ── Android APK ────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Sync pubspec version with tag
        shell: bash
        working-directory: mobile-sales-app
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-sales-app-v}"
          sed -i "s/^version: .*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          echo "pubspec version -> ${VERSION}+${GITHUB_RUN_NUMBER}"
      - name: flutter pub get
        working-directory: mobile-sales-app
        run: flutter pub get
      - name: Build APK (release, prod)
        working-directory: mobile-sales-app
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
      - name: Rename APK
        working-directory: mobile-sales-app
        run: cp build/app/outputs/flutter-apk/app-release.apk build/VentaGO-Ventas.apk
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-sales-app/build/VentaGO-Ventas.apk
          tag_name: ${{ github.ref_name }}
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

  # ── Windows (zip) ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: flutter pub get
        working-directory: mobile-sales-app
        run: flutter pub get
      - name: Build Windows (release, prod)
        working-directory: mobile-sales-app
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
      - name: Zip Windows build
        shell: pwsh
        working-directory: mobile-sales-app
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-Not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          Compress-Archive -Path "$src/*" -DestinationPath "build/VentaGO-Ventas-Windows.zip" -Force
      - name: Upload Windows zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-sales-app/build/VentaGO-Ventas-Windows.zip
          tag_name: ${{ github.ref_name }}
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

  # ── macOS (zip) ────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (zip)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      # macos/ 스캐폴드가 repo 에 없을 수 있어 보장 (network.client 권한 포함 생성)
      - name: Ensure macOS platform
        working-directory: mobile-sales-app
        run: |
          [ -d macos ] || flutter create --platforms=macos .
          for ENT in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$ENT" 2>/dev/null || true
          done
      - name: flutter pub get
        working-directory: mobile-sales-app
        run: flutter pub get
      - name: Build macOS (release, prod)
        working-directory: mobile-sales-app
        run: flutter build macos --release --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
      # Flutter macOS 산출물은 .app 번들 → zip 으로 배포. (정식 배포는 서명/notarize 필요.)
      - name: Zip macOS build
        working-directory: mobile-sales-app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "build/VentaGO-Ventas-macOS.zip"
      - name: Upload macOS zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-sales-app/build/VentaGO-Ventas-macOS.zip
          tag_name: ${{ github.ref_name }}
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

  # ── iOS (검증 빌드만) ───────────────────────────────────────────────────────
  # ⚠️ iOS 는 단순 다운로드 설치 불가 — 배포는 TestFlight/Ad Hoc 서명 필요(Apple Developer 계정).
  # 아래는 컴파일 검증용 unsigned 빌드. 실제 배포 파이프라인은 서명 secret 준비 후 별도 구성.
  build-ios-check:
    name: iOS (compile check, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: flutter pub get
        working-directory: mobile-sales-app
        run: flutter pub get
      - name: Build iOS (release, no codesign)
        working-directory: mobile-sales-app
        run: flutter build ios --release --no-codesign --dart-define=BASE_URL=${{ env.PROD_BASE_URL }}
      # 산출물은 미서명이라 설치 불가 — 릴리스 업로드 안 함(검증 용도). TestFlight 는 별도.
