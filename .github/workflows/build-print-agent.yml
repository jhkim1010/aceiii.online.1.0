name: Build & Release Print Agent

on:
  push:
    tags:
      - 'print-agent-v*'

permissions:
  contents: write

jobs:
  # ── Windows .exe ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci

      # 태그(print-agent-vX.Y.Z) → 버전, 빌드 날짜를 build-info.js 에 stamp.
      # 화면 헤더에 "vX.Y.Z · YYYY-MM-DD" 로 표시되어 어느 빌드인지 식별됨.
      - name: Stamp build info
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          DATE="$(date -u +%Y-%m-%d)"
          cat > print-agent/renderer/build-info.js <<EOF
          // build-info.js — CI 빌드 시 자동 생성 (수정 금지).
          window.__BUILD_INFO__ = {
            version: '${VERSION}',
            date: '${DATE}',
          };
          EOF
          echo "Stamped: v${VERSION} · ${DATE}"

      - name: Rebuild native modules for Electron
        working-directory: print-agent
        run: npx --yes electron-builder install-app-deps

      - name: Build Windows installer
        working-directory: print-agent
        run: npx --yes electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: print-agent/build/VentaGO-Print-Agent-Setup.exe
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true

  # ── macOS .dmg ───────────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci

      # 태그(print-agent-vX.Y.Z) → 버전, 빌드 날짜를 build-info.js 에 stamp.
      - name: Stamp build info
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          DATE="$(date -u +%Y-%m-%d)"
          cat > print-agent/renderer/build-info.js <<EOF
          // build-info.js — CI 빌드 시 자동 생성 (수정 금지).
          window.__BUILD_INFO__ = {
            version: '${VERSION}',
            date: '${DATE}',
          };
          EOF
          echo "Stamped: v${VERSION} · ${DATE}"

      - name: Rebuild native modules for Electron
        working-directory: print-agent
        run: npx --yes electron-builder install-app-deps

      - name: Build macOS DMG
        working-directory: print-agent
        run: npx --yes electron-builder --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            print-agent/build/VentaGO-Print-Agent-x64.dmg
            print-agent/build/VentaGO-Print-Agent-arm64.dmg
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
