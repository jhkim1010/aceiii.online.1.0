name: Build & Release Print Agent

on:
  push:
    tags:
      - 'print-agent-v*'

permissions:
  contents: write

jobs:
  # ── Windows .exe ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci

      # 태그(print-agent-vX.Y.Z) → 버전, 빌드 날짜를 build-info.js 에 stamp.
      # 화면 헤더에 "vX.Y.Z · YYYY-MM-DD" 로 표시되어 어느 빌드인지 식별됨.
      - name: Stamp build info
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          DATE="$(date -u +%Y-%m-%d)"
          cat > print-agent/renderer/build-info.js <<EOF
          // build-info.js — CI 빌드 시 자동 생성 (수정 금지).
          window.__BUILD_INFO__ = {
            version: '${VERSION}',
            date: '${DATE}',
          };
          EOF
          echo "Stamped: v${VERSION} · ${DATE}"

      # electron-updater 버전 비교용 — package.json version 을 태그 버전과 동기화.
      # 이게 없으면 설치된 앱이 항상 구버전(예: 1.0.9)으로 자신을 인식해 오작동.
      - name: Sync package.json version with tag
        shell: bash
        working-directory: print-agent
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "package.json version -> ${VERSION}"

      - name: Rebuild native modules for Electron
        working-directory: print-agent
        run: npx --yes electron-builder install-app-deps

      - name: Build Windows installer
        working-directory: print-agent
        # x64 + ia32 둘 다 빌드 → 단일 NSIS 설치파일에 두 아키텍처 포함
        # (설치 시 OS 비트에 맞게 자동 선택). 32비트 구형 윈도우 PC 지원.
        run: npx --yes electron-builder --win --x64 --ia32 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: print-agent/build/VentaGO-Print-Agent-Setup.exe
          tag_name: ${{ github.ref_name }}
          # 릴리스는 전용 public repo 로 업로드 (코드 repo 는 private 유지)
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

      # ── 자동 업데이트 피드 (롤링 릴리즈) ──────────────────────────────────
      # 설치된 에이전트(electron-updater)는 고정 태그 print-agent-latest 의
      # latest.yml 만 바라봄. 같은 이름 자산은 덮어쓰기됨.
      # blockmap 은 차등 다운로드용 (없어도 전체 다운로드로 폴백).
      - name: Upload auto-update feed (print-agent-latest)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            print-agent/build/latest.yml
            print-agent/build/VentaGO-Print-Agent-Setup.exe
            print-agent/build/VentaGO-Print-Agent-Setup.exe.blockmap
          tag_name: print-agent-latest
          name: 'Print Agent — auto-update feed (latest)'
          body: 'electron-updater 자동 업데이트용 롤링 릴리즈. 수동 다운로드는 버전별 릴리즈 사용.'
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true

  # ── macOS .dmg ───────────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci

      # 태그(print-agent-vX.Y.Z) → 버전, 빌드 날짜를 build-info.js 에 stamp.
      - name: Stamp build info
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          DATE="$(date -u +%Y-%m-%d)"
          cat > print-agent/renderer/build-info.js <<EOF
          // build-info.js — CI 빌드 시 자동 생성 (수정 금지).
          window.__BUILD_INFO__ = {
            version: '${VERSION}',
            date: '${DATE}',
          };
          EOF
          echo "Stamped: v${VERSION} · ${DATE}"

      # app.getVersion() 정확성용 버전 동기화 (mac 은 자동 업데이트 미지원 — 미서명)
      - name: Sync package.json version with tag
        shell: bash
        working-directory: print-agent
        run: |
          VERSION="${GITHUB_REF_NAME#print-agent-v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Rebuild native modules for Electron
        working-directory: print-agent
        run: npx --yes electron-builder install-app-deps

      - name: Build macOS DMG
        working-directory: print-agent
        run: npx --yes electron-builder --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            print-agent/build/VentaGO-Print-Agent-x64.dmg
            print-agent/build/VentaGO-Print-Agent-arm64.dmg
          tag_name: ${{ github.ref_name }}
          # 릴리스는 전용 public repo 로 업로드 (코드 repo 는 private 유지)
          repository: jhkim1010/ventago-downloads
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          fail_on_unmatched_files: true
