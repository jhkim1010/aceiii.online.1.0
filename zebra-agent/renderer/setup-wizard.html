<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentaGO Zebra Agent — Setup</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>VentaGO Zebra Agent</h1>
    <div class="subtitle">Configuración inicial</div>
  </div>

  <div class="step-indicator">
    <div class="step-dot active" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
  </div>

  <!-- Step 1: API Key 입력 (서버 URL 고정) -->
  <div class="wizard-step active" id="step-1">
    <div class="card">
      <div class="card-title">Paso 1 — Verificar API Key</div>
      <div class="form-group">
        <label>API Key (del panel de administración)</label>
        <input type="text" id="apiKey" placeholder="vg_pr_...">
      </div>
      <div id="ws-test-result" style="font-size:12px; margin-bottom:8px;"></div>
      <div id="agent-info-box" style="display:none; background:#0f3460; border-radius:6px; padding:10px; margin-bottom:10px; font-size:13px;">
        <div style="margin-bottom:4px;"><span style="color:#888;">Tienda:</span> <span id="info-store" style="color:#4caf50; font-weight:600;"></span></div>
        <div><span style="color:#888;">Sucursal:</span> <span id="info-branch" style="color:#4caf50; font-weight:600;"></span></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-test-ws">Verificar</button>
        <button class="btn btn-primary" id="btn-next-1" disabled>Siguiente →</button>
      </div>
    </div>
  </div>

  <!-- Step 2: 프린터 선택 — 감지된 프린터 리스트 우선 (USB + RED) -->
  <div class="wizard-step" id="step-2">
    <div class="card">
      <div class="card-title">Paso 2 — Impresora Zebra</div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <button class="btn btn-secondary" id="btn-discover">Buscar impresoras</button>
        <span id="discover-status" style="font-size:12px; color:#888;"></span>
      </div>
      <div class="form-group">
        <label>Impresora detectada</label>
        <select id="printer-select" style="width:100%; padding:8px 10px; background:#0f3460;
          border:1px solid #2a2a4a; border-radius:6px; color:#e0e0e0; font-size:13px;">
          <option value="">— Seleccionar —</option>
        </select>
      </div>

      <!-- 수동 IP 입력 (fallback) -->
      <button class="btn btn-secondary" id="btn-manual-toggle" style="margin-top:10px; font-size:11px; padding:5px 12px;">
        Configuración manual (IP)
      </button>
      <div id="manual-fields" style="display:none; margin-top:10px;">
        <div class="form-group">
          <label>IP de la impresora</label>
          <input type="text" id="printerHost" placeholder="192.168.1.100">
        </div>
        <div class="form-group">
          <label>Puerto</label>
          <input type="number" id="printerPort" value="9100">
        </div>
      </div>

      <div id="printer-test-result" style="font-size:12px; margin-top:8px;"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-back-2">← Atrás</button>
        <button class="btn btn-secondary" id="btn-test-printer">Probar impresora</button>
        <button class="btn btn-primary" id="btn-next-2">Siguiente →</button>
      </div>
    </div>
  </div>

  <!-- Step 3: 라벨 설정 + 완료 -->
  <div class="wizard-step" id="step-3">
    <div class="card">
      <div class="card-title">Paso 3 — Etiqueta</div>
      <div class="form-group">
        <label>Ancho (dots, 203dpi: 50mm = 400)</label>
        <input type="number" id="labelWidth" value="400">
      </div>
      <div class="form-group">
        <label>Alto (dots, 203dpi: 30mm = 236)</label>
        <input type="number" id="labelHeight" value="236">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-back-3">← Atrás</button>
        <button class="btn btn-primary" id="btn-finish">Finalizar configuración</button>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (sel) => document.querySelector(sel);
  const api = window.electronAPI;

  // 안전한 상태 메시지 표시 (textContent 사용)
  function showResult(el, text, success) {
    el.textContent = text;
    el.style.color = success ? '#4caf50' : '#ef5350';
  }

  function goStep(n) {
    document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
    $(`#step-${n}`).classList.add('active');
    for (let i = 1; i <= 3; i++) {
      const dot = $(`#dot-${i}`);
      dot.className = 'step-dot';
      if (i < n) dot.classList.add('done');
      if (i === n) dot.classList.add('active');
    }
  }

  // Step 1: API Key 검증 (서버 URL 고정)
  $('#btn-test-ws').addEventListener('click', async () => {
    const key = $('#apiKey').value.trim();
    const el = $('#ws-test-result');

    if (!key) { el.textContent = 'Ingresar API Key'; el.style.color = '#ff9800'; return; }

    el.textContent = 'Verificando...';
    el.style.color = '#e0e0e0';
    $('#agent-info-box').style.display = 'none';

    const result = await api.testConnection('', key);

    if (result.success) {
      showResult(el, 'API Key válida', true);
      $('#btn-next-1').disabled = false;

      // 매장/지점 정보 표시
      if (result.storeName || result.branchName) {
        $('#info-store').textContent = result.storeName || '-';
        $('#info-branch').textContent = result.branchName || '-';
        $('#agent-info-box').style.display = 'block';
      }
    } else {
      showResult(el, result.error, false);
    }
  });

  // Step 2 진입 시 자동 스캔 (1회)
  let wizardScanned = false;

  $('#btn-next-1').addEventListener('click', () => {
    goStep(2);
    if (!wizardScanned) { wizardScanned = true; wizardScan(); }
  });
  $('#btn-back-2').addEventListener('click', () => goStep(1));
  $('#btn-back-3').addEventListener('click', () => goStep(2));
  $('#btn-next-2').addEventListener('click', () => goStep(3));

  // ── Step 2: 프린터 감지 리스트 (USB + RED) ──
  let selectedPrinter = null; // { type:'usb'|'network', printerName?, host?, port? }
  let detected = [];

  api.onDiscoverProgress((data) => {
    $('#discover-status').textContent = 'Escaneando red: ' + data.scanned + '/' + data.total;
  });

  async function wizardScan() {
    $('#discover-status').textContent = '⏳ Buscando USB y red...';
    detected = [];
    fillPrinterSelect();

    // USB 조회 + 네트워크 스캔 병렬
    const [usb, ips] = await Promise.all([
      api.listUsbPrinters().catch(() => []),
      api.discoverPrinters().catch(() => []),
    ]);
    (usb || []).forEach(name => detected.push({ type: 'usb', printerName: name }));
    (ips || []).forEach(ip => detected.push({ type: 'network', host: ip, port: 9100 }));

    fillPrinterSelect();

    // 자동 선택: 이름에 "Zebra" 포함 → 없으면 "Z" 포함 → 없으면 사용자가 콤보에서 선택
    const autoIdx = autoPickIndex();
    if (autoIdx >= 0) {
      $('#printer-select').value = String(autoIdx);
      applySelection(autoIdx);
      $('#discover-status').textContent = '✅ Auto-seleccionada: ' + printerLabel(detected[autoIdx]);
    } else {
      $('#discover-status').textContent = detected.length > 0
        ? '✅ ' + detected.length + ' impresora(s) — elegí en la lista'
        : '⚠️ Sin resultados — probá "Configuración manual (IP)"';
    }
  }

  $('#btn-discover').addEventListener('click', wizardScan);

  // 자동 선택 인덱스 — Zebra 포함 우선, 그다음 Z 포함 (USB 이름 기준)
  function autoPickIndex() {
    const byName = (re) => detected.findIndex(p => re.test(p.printerName || ''));
    const zebraIdx = byName(/zebra/i);
    if (zebraIdx >= 0) return zebraIdx;

    return byName(/z/i);
  }

  function printerLabel(p) {
    return p.type === 'usb'
      ? 'USB — ' + p.printerName
      : 'RED — ' + p.host + ':' + (p.port || 9100);
  }

  function fillPrinterSelect() {
    const sel = $('#printer-select');
    sel.textContent = '';

    const none = document.createElement('option');
    none.value = '';
    none.textContent = detected.length > 0 ? '— Seleccionar —' : '— Sin impresoras (buscar de nuevo) —';
    sel.appendChild(none);

    detected.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = printerLabel(p);
      sel.appendChild(opt);
    });
  }

  function applySelection(idx) {
    const p = detected[idx];
    if (!p) { selectedPrinter = null; return; }
    selectedPrinter = p;
    if (p.type === 'network') {
      $('#printerHost').value = p.host;
      $('#printerPort').value = p.port || 9100;
    }
    $('#printer-test-result').textContent = '';
  }

  $('#printer-select').addEventListener('change', () => {
    const v = $('#printer-select').value;
    if (v === '') { selectedPrinter = null; return; }
    applySelection(parseInt(v, 10));
  });

  // 수동 IP 토글 — 값 입력 시 network 수동 선택으로 전환
  $('#btn-manual-toggle').addEventListener('click', () => {
    const el = $('#manual-fields');
    const visible = el.style.display !== 'none';
    el.style.display = visible ? 'none' : 'block';
    $('#btn-manual-toggle').textContent = visible ? 'Configuración manual (IP)' : 'Ocultar configuración manual';
  });

  $('#printerHost').addEventListener('input', () => {
    selectedPrinter = null; // 수동 입력 우선 — 리스트 선택 해제
    renderWizardList();
  });

  // 현재 선택(리스트 또는 수동 IP)을 printer 설정 객체로 변환
  function resolvePrinterConfig() {
    if (selectedPrinter?.type === 'usb') {
      return { type: 'usb', printerName: selectedPrinter.printerName, host: '', port: 9100 };
    }
    const host = (selectedPrinter?.host || $('#printerHost').value || '').trim();
    if (!host) return null;

    return {
      type: 'network',
      host,
      port: selectedPrinter?.port || parseInt($('#printerPort').value) || 9100,
      printerName: '',
    };
  }

  // Step 2: 프린터 테스트
  $('#btn-test-printer').addEventListener('click', async () => {
    const el = $('#printer-test-result');
    const cfg = resolvePrinterConfig();

    if (!cfg) { el.textContent = '⚠️ Seleccioná una impresora o ingresá IP'; el.style.color = '#ff9800'; return; }

    if (cfg.type === 'usb') {
      // USB 는 TCP 테스트 불가 — 선택만 확인, 실제 테스트는 완료 후 "Imprimir test"
      showResult(el, '✅ USB seleccionada: ' + cfg.printerName + ' (test de impresión al finalizar)', true);

      return;
    }

    el.textContent = '⏳ Probando conexión...';
    el.style.color = '#e0e0e0';
    const ok = await api.testPrinterConnection(cfg.host, cfg.port);
    showResult(el, ok ? '✅ Impresora accesible' : '❌ No se pudo conectar', ok);
  });

  // Step 3: 완료
  $('#btn-finish').addEventListener('click', async () => {
    const cfg = resolvePrinterConfig();

    if (!cfg) {
      goStep(2);
      $('#printer-test-result').textContent = '⚠️ Seleccioná una impresora o ingresá IP';
      $('#printer-test-result').style.color = '#ff9800';

      return;
    }

    await api.setAllConfig({
      apiKey: $('#apiKey').value.trim(),
      agentType: 'zebra',
      printer: cfg,
      labelMode: 'simple-face',
    });
    await api.completeSetup();
  });

  // 초기 로드
  (async () => {
    const key = await api.getConfig('apiKey');
    const printer = await api.getConfig('printer');

    if (key) $('#apiKey').value = key;
    if (printer?.host) $('#printerHost').value = printer.host;
    if (printer?.port) $('#printerPort').value = printer.port;

    // 기존 설정 복원 (재실행 시) — 콤보 첫 항목으로 노출
    if (printer?.type === 'usb' && printer.printerName) {
      selectedPrinter = { type: 'usb', printerName: printer.printerName };
      detected.push(selectedPrinter);
      fillPrinterSelect();
      $('#printer-select').value = '0';
    } else if (printer?.host) {
      selectedPrinter = { type: 'network', host: printer.host, port: printer.port || 9100 };
    }
  })();
</script>
</body>
</html>
