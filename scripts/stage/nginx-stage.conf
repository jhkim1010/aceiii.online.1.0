# [2026-10-22] STAGE (운용3) — se activa con activar-https.sh cuando existe el certificado.
#   Copia de producción saneada: misma exposición que producción (login con usuarios reales) — noindex.
server {
    listen 80;
    server_name stage.coolsistema.com stageapi.coolsistema.com stageminio.coolsistema.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name stage.coolsistema.com;
    ssl_certificate     /etc/letsencrypt/live/stage.coolsistema.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.coolsistema.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name stageapi.coolsistema.com;
    ssl_certificate     /etc/letsencrypt/live/stage.coolsistema.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.coolsistema.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 200m;
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5102/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
server {
    listen 443 ssl;
    server_name stageminio.coolsistema.com;
    ssl_certificate     /etc/letsencrypt/live/stage.coolsistema.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.coolsistema.com/privkey.pem;
    client_max_body_size 200m;
    location / {
        proxy_pass http://127.0.0.1:9105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
