# 운용3 — Ventago 의 3개 도메인. 운영 /etc/nginx/sites-enabled/{newapi,app,apiminio}.coolsistema.com.conf 와 같은 동작.
# ★ 다른 점: api 는 host 네트워크라 127.0.0.1:5002 (운영은 blue/green 5002/5003).
# ★ 평소엔 컨테이너가 꺼져 있어 502 가 정상이다. DNS 가 이 서버를 가리킬 때만 의미가 있다.
upstream ventago_api { server 127.0.0.1:5002; }

server { listen 80; server_name newapi.coolsistema.com; location / { return 301 https://newapi.coolsistema.com$request_uri; } }
server { listen 80; server_name app.coolsistema.com;    location / { return 301 https://app.coolsistema.com$request_uri; } }

server {
    listen 443 ssl;
    server_name newapi.coolsistema.com;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_certificate     /etc/ssl/ventago/fullchain.pem;
    ssl_certificate_key /etc/ssl/ventago/privkey.pem;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024; gzip_types application/json;
    client_max_body_size 25m;
    location /socket.io/ {
        proxy_pass http://ventago_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
    location /api/legacy-import/ {
        client_max_body_size 128m; proxy_read_timeout 600s; proxy_send_timeout 600s;
        proxy_pass http://ventago_api;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/chat/ {
        proxy_read_timeout 150s; proxy_send_timeout 150s;
        proxy_pass http://ventago_api;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://ventago_api;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name app.coolsistema.com;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_certificate     /etc/ssl/ventago/fullchain.pem;
    ssl_certificate_key /etc/ssl/ventago/privkey.pem;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024; gzip_types application/json;
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name apiminio.coolsistema.com;
    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_set_header Host $host:$server_port; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    client_max_body_size 25m;
    server_name apiminio.coolsistema.com;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_certificate     /etc/ssl/ventago/fullchain.pem;
    ssl_certificate_key /etc/ssl/ventago/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_set_header Host $host:$server_port; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Connection "";
    }
}
