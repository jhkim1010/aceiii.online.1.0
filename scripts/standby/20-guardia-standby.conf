# /etc/systemd/system/postgresql@18-ventago18.service.d/20-guardia-standby.conf (PROD)
# Antes de arrancar el Postgres de prod, preguntarle a 운용3 si está promovido.
# ★ network-online: al bootear, sin red la pregunta falla y la guardia deja arrancar
#   (regla «no responde → arranca»), justo cuando más importa. Esperar a la red primero.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStartPre=/usr/local/sbin/ventago-guardia-arranque
