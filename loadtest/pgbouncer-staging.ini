;; Phase 63 부하테스트 전용 pgbouncer (운영 pgbouncer 와 완전 분리)
;;
;; 운영 인스턴스(5432)는 ventago 외 ~125개 DB(coolinvoice 등 별도 시스템)를 함께
;; 서비스하며 pgbouncer 는 단일 스레드다. 부하 테스트를 운영 pgbouncer 에 태우면
;; 전 시스템이 느려지므로 스테이징은 별도 프로세스/포트(6432)로 격리한다.
;; pool 설정은 운영과 동일(transaction / pool_size 50)하게 맞춰 조건을 재현한다.
;;
;; 배치: /var/lib/postgresql/pgbouncer-staging.ini (postgres 소유)
;; 기동: sudo -u postgres pgbouncer -d /var/lib/postgresql/pgbouncer-staging.ini
;; 중지: sudo -u postgres pkill -F /var/run/postgresql/pgbouncer-staging.pid

[databases]
ventago_staging = host=127.0.0.1 port=5434 dbname=ventago_staging pool_size=50

[pgbouncer]
ignore_startup_parameters = extra_float_digits
listen_port = 6432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 10
reserve_pool_timeout = 3
server_connect_timeout = 10
server_idle_timeout = 600
client_idle_timeout = 300
logfile = /var/lib/postgresql/pgbouncer-staging.log
pidfile = /var/run/postgresql/pgbouncer-staging.pid
stats_users = coolsistema,postgres
admin_users = postgres
